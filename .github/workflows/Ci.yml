name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'checkout-api/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: checkout-api

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: checkout-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build / typecheck
        run: npm run build

      - name: Run tests
        run: npm test --if-present